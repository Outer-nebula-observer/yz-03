  <text x="90.00" y="92.73" font-size="37.33px" font-weight="600" fill="#0B0B0B">系统总体架构</text>
  <text x="90.00" y="129.60" font-size="24.00px" font-weight="400" fill="#52514E">七步闭环 · 短期工作记忆 · 复盘晋升门控 · 事实/经验双库 · 三路混合检索 · 进化四操作</text>
  <text x="114.00" y="180.40" font-size="21.33px" font-weight="600" fill="#52514E">编排层 · 七步闭环</text>
