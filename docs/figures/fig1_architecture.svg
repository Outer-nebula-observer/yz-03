  <text x="118.00" y="336.27" font-size="26.67px" font-weight="600" fill="#0B0B0B">短期工作记忆</text>
  <text x="118.00" y="378.27" font-size="21.33px" font-weight="400" fill="#52514E">槽位：目标 · 约束 · 查询列表 · 滚动消息</text>
  <text x="118.00" y="414.27" font-size="21.33px" font-weight="400" fill="#898781">容量受限，达阈值时压缩历史消息；约束字段永不压缩</text>
  <text x="118.00" y="514.00" font-size="26.67px" font-weight="600" fill="#0B0B0B">复盘晋升 · 短期进入长期记忆的唯一通道</text>
  <text x="228.00" y="576.00" font-size="21.33px" font-weight="600" fill="#0B0B0B" text-anchor="middle">复盘驱动</text>
  <text x="480.00" y="576.00" font-size="21.33px" font-weight="600" fill="#0B0B0B" text-anchor="middle">类别门</text>
  <text x="732.00" y="576.00" font-size="21.33px" font-weight="600" fill="#0B0B0B" text-anchor="middle">查重 θ</text>
  <text x="896.00" y="576.00" font-size="21.33px" font-weight="400" fill="#898781">写入只留一个正规入口，放行或拒绝均记审计</text>
  <text x="118.00" y="698.43" font-size="26.67px" font-weight="600" fill="#0B0B0B">长期记忆 · 双库分治</text>
  <text x="138.00" y="752.47" font-size="26.67px" font-weight="600" fill="#0B0B0B">事实库</text>
  <text x="138.00" y="786.47" font-size="21.33px" font-weight="400" fill="#52514E">SQLite · 属性精确过滤</text>
  <text x="138.00" y="818.47" font-size="20.00px" font-weight="400" fill="#898781">参数 · 条令 · 地形</text>
  <text x="138.00" y="848.47" font-size="20.00px" font-weight="400" fill="#898781">要求“差一个数字就是错”</text>
  <text x="760.00" y="752.47" font-size="26.67px" font-weight="600" fill="#0B0B0B">经验库</text>
  <text x="760.00" y="786.47" font-size="21.33px" font-weight="400" fill="#52514E">向量 · 语义召回</text>
  <text x="760.00" y="818.47" font-size="20.00px" font-weight="400" fill="#898781">教训 · 对策</text>
  <text x="760.00" y="848.47" font-size="20.00px" font-weight="400" fill="#898781">要求“换个说法也能搜到”</text>
  <text x="720.00" y="904.40" font-size="21.33px" font-weight="400" fill="#52514E" text-anchor="middle">更新 / 淘汰</text>
  <text x="118.00" y="956.40" font-size="26.67px" font-weight="600" fill="#0B0B0B">进化：写入 · 合并 · 遗忘 · 抽象</text>
  <text x="1262.00" y="960.80" font-size="21.33px" font-weight="400" fill="#52514E">三路读取</text>
  <text x="118.00" y="1098.87" font-size="26.67px" font-weight="600" fill="#0B0B0B">检索层 · 任务感知的三路混合检索</text>
  <text x="230.00" y="1145.87" font-size="21.33px" font-weight="600" fill="#0B0B0B" text-anchor="middle">向量 · 语义</text>
  <text x="488.00" y="1145.87" font-size="21.33px" font-weight="600" fill="#0B0B0B" text-anchor="middle">BM25 · 词法</text>
  <text x="746.00" y="1145.87" font-size="21.33px" font-weight="600" fill="#0B0B0B" text-anchor="middle">属性精确</text>
  <text x="880.00" y="1144.87" font-size="20.00px" font-weight="400" fill="#52514E">→ 归一加权融合（记忆类型先验 + 阶段亲和）</text>
  <text x="880.00" y="1186.27" font-size="20.00px" font-weight="400" fill="#898781">按 MDMP 阶段生成查询，命中后再给对口阶段加分</text>
  <text x="114.00" y="1188.87" font-size="20.00px" font-weight="400" fill="#898781">注：三路中仅“属性精确”只走事实库，向量与 BM25 两库均查</text>
  <text x="1422.00" y="730.80" font-size="21.33px" font-weight="400" fill="#2A78D6" text-anchor="middle" transform="translate(1422.00,730.80) rotate(90)">装载进上下文</text>
  <text x="118.00" y="1274.80" font-size="24.00px" font-weight="400" fill="#52514E">审计日志 · 全链路可回放：每条记忆为什么写入、为什么删除</text>
